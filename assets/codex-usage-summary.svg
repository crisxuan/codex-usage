<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Codex usage monitor preview</title>
  <desc id="desc">An anonymized preview showing configurable Codex usage monitoring, rolling token snapshots, and public-safe aggregate data.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7fb; }
      .panel { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1; }
      .ink { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #62656f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .blue { fill: #3772ff; }
      .green { fill: #0f9d58; }
      .amber { fill: #d9801f; }
      .grid { stroke: #e7eaf1; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="760" height="300" rx="16"/>

  <text class="ink" x="28" y="42" font-size="25" font-weight="760">Codex Usage Monitor</text>
  <text class="muted" x="28" y="66" font-size="13">Open-source local usage tracking. Choose your own monitoring cadence.</text>

  <rect x="532" y="24" width="84" height="28" rx="14" fill="#edf4ff"/>
  <text class="muted" x="552" y="43" font-size="12">3h demo</text>
  <rect x="626" y="24" width="104" height="28" rx="14" fill="#edf8f1"/>
  <text class="muted" x="646" y="43" font-size="12">aggregate only</text>

  <rect class="panel" x="28" y="92" width="160" height="76" rx="8"/>
  <text class="muted" x="44" y="118" font-size="12">Window tokens</text>
  <text class="ink" x="44" y="150" font-size="27" font-weight="760">28.46M</text>

  <rect class="panel" x="204" y="92" width="160" height="76" rx="8"/>
  <text class="muted" x="220" y="118" font-size="12">API equivalent</text>
  <text class="ink" x="220" y="150" font-size="27" font-weight="760">$23.86</text>

  <rect class="panel" x="380" y="92" width="160" height="76" rx="8"/>
  <text class="muted" x="396" y="118" font-size="12">Weekly remaining</text>
  <text class="green" x="396" y="150" font-size="27" font-weight="760">95%</text>

  <rect class="panel" x="556" y="92" width="174" height="76" rx="8"/>
  <text class="muted" x="572" y="118" font-size="12">Cadence examples</text>
  <text class="ink" x="572" y="143" font-size="17" font-weight="720">daily / hourly</text>
  <text class="muted" x="572" y="160" font-size="12">custom windows</text>

  <rect class="panel" x="28" y="190" width="702" height="82" rx="8"/>
  <text class="ink" x="44" y="218" font-size="15" font-weight="720">Rolling snapshots</text>
  <text class="muted" x="606" y="218" font-size="12">tokens</text>
  <circle class="blue" cx="596" cy="214" r="4"/>
  <text class="muted" x="674" y="218" font-size="12">remaining</text>
  <circle class="green" cx="664" cy="214" r="4"/>

  <line class="grid" x1="44" y1="260" x2="704" y2="260"/>
  <line class="grid" x1="44" y1="242" x2="704" y2="242"/>

  <rect class="blue" x="70" y="244" width="18" height="16" rx="4"/>
  <rect class="blue" x="122" y="238" width="18" height="22" rx="4"/>
  <rect class="blue" x="174" y="242" width="18" height="18" rx="4"/>
  <rect class="blue" x="226" y="232" width="18" height="28" rx="4"/>
  <rect class="blue" x="278" y="226" width="18" height="34" rx="4"/>
  <rect class="blue" x="330" y="234" width="18" height="26" rx="4"/>
  <rect class="blue" x="382" y="222" width="18" height="38" rx="4"/>
  <rect class="blue" x="434" y="230" width="18" height="30" rx="4"/>
  <rect class="blue" x="486" y="236" width="18" height="24" rx="4"/>
  <rect class="blue" x="538" y="242" width="18" height="18" rx="4"/>
  <rect class="blue" x="590" y="234" width="18" height="26" rx="4"/>
  <rect class="blue" x="642" y="228" width="18" height="32" rx="4"/>

  <polyline points="79,233 131,234 183,235 235,236 287,237 339,238 391,239 443,240 495,241 547,242 599,243 651,244" fill="none" stroke="#0f9d58" stroke-width="2.5"/>
  <circle class="green" cx="651" cy="244" r="4"/>
</svg>
