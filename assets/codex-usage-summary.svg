<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex usage summary preview</title>
  <desc id="desc">An anonymized example dashboard showing Codex token usage, cached input share, output tokens, and rate-limit snapshots.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .card { fill: #ffffff; stroke: #ddd8cc; stroke-width: 1; }
      .ink { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #636770; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #202124; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .green { fill: #0f9d58; }
      .blue { fill: #3772ff; }
      .amber { fill: #d9801f; }
      .red { fill: #cc3d3d; }
      .line { stroke: #e5e0d5; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="920" height="420" rx="18"/>

  <text class="ink" x="34" y="46" font-size="27" font-weight="750">Codex Usage Summary</text>
  <text class="muted" x="34" y="72" font-size="14">Native token_count logs, local only, static HTML/SVG output</text>
  <rect x="716" y="30" width="70" height="28" rx="14" fill="#e9f2ff"/>
  <text class="muted" x="737" y="49" font-size="13">today</text>
  <rect x="798" y="30" width="88" height="28" rx="14" fill="#eef7ef"/>
  <text class="muted" x="818" y="49" font-size="13">--lang zh</text>

  <rect class="card" x="34" y="104" width="198" height="92" rx="8"/>
  <text class="muted" x="54" y="132" font-size="13">Total tokens</text>
  <text class="ink" x="54" y="167" font-size="31" font-weight="750">705.8M</text>
  <text class="muted" x="54" y="185" font-size="12">18 sessions, 4,284 events</text>

  <rect class="card" x="252" y="104" width="198" height="92" rx="8"/>
  <text class="muted" x="272" y="132" font-size="13">Cached input</text>
  <text class="ink" x="272" y="167" font-size="31" font-weight="750">680.9M</text>
  <text class="green" x="272" y="185" font-size="12">96.6% of input</text>

  <rect class="card" x="470" y="104" width="198" height="92" rx="8"/>
  <text class="muted" x="490" y="132" font-size="13">Output tokens</text>
  <text class="ink" x="490" y="167" font-size="31" font-weight="750">1.44M</text>
  <text class="muted" x="490" y="185" font-size="12">reasoning shown separately</text>

  <rect class="card" x="688" y="104" width="198" height="92" rx="8"/>
  <text class="muted" x="708" y="132" font-size="13">Secondary limit</text>
  <text class="ink" x="708" y="167" font-size="31" font-weight="750">54% -> 73%</text>
  <text class="amber" x="708" y="185" font-size="12">+19% in this window</text>

  <rect class="card" x="34" y="222" width="852" height="154" rx="8"/>
  <text class="ink" x="56" y="253" font-size="18" font-weight="700">Token mix</text>
  <text class="muted" x="56" y="276" font-size="13">Cached input dominates long Codex sessions, while output stays small but expensive.</text>

  <rect x="56" y="304" width="760" height="26" rx="6" fill="#eee9de"/>
  <rect class="green" x="56" y="304" width="733" height="26" rx="6"/>
  <rect class="amber" x="789" y="304" width="25" height="26"/>
  <rect class="red" x="814" y="304" width="2" height="26" rx="1"/>
  <text class="mono" x="56" y="354" font-size="12">cached input</text>
  <circle class="green" cx="44" cy="350" r="5"/>
  <text class="mono" x="176" y="354" font-size="12">non-cached input</text>
  <circle class="amber" cx="164" cy="350" r="5"/>
  <text class="mono" x="340" y="354" font-size="12">output</text>
  <circle class="red" cx="328" cy="350" r="5"/>

  <line class="line" x1="56" y1="292" x2="816" y2="292"/>
  <text class="muted" x="826" y="324" font-size="13">100%</text>
</svg>
