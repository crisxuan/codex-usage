<svg xmlns="http://www.w3.org/2000/svg" width="360" height="250" viewBox="0 0 360 250" role="img" aria-labelledby="title desc">
  <title id="title">Codex cadence and privacy preview</title>
  <desc id="desc">An anonymized preview card showing configurable monitoring schedules and public-safe aggregate publishing.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1; }
      .soft { fill: #f8fafc; stroke: #e7eaf1; stroke-width: 1; }
      .ink { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #62656f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .blue { fill: #3772ff; }
      .green { fill: #0f9d58; }
      .amber { fill: #d9801f; }
    </style>
  </defs>

  <rect class="panel" x="1" y="1" width="358" height="248" rx="10"/>
  <text class="ink" x="22" y="38" font-size="20" font-weight="760">Cadence &amp; privacy</text>
  <text class="muted" x="22" y="61" font-size="12">Your monitor, your schedule</text>

  <rect class="soft" x="22" y="84" width="316" height="44" rx="8"/>
  <circle class="blue" cx="42" cy="106" r="6"/>
  <text class="ink" x="58" y="102" font-size="13" font-weight="700">Configurable cadence</text>
  <text class="muted" x="58" y="119" font-size="11">daily, hourly, 3h, or any custom window</text>

  <rect class="soft" x="22" y="140" width="316" height="44" rx="8"/>
  <circle class="green" cx="42" cy="162" r="6"/>
  <text class="ink" x="58" y="158" font-size="13" font-weight="700">Public-safe output</text>
  <text class="muted" x="58" y="175" font-size="11">aggregate tokens, cost, and limit windows only</text>

  <rect class="soft" x="22" y="196" width="316" height="32" rx="8"/>
  <circle class="amber" cx="42" cy="212" r="6"/>
  <text class="ink" x="58" y="216" font-size="13" font-weight="700">No raw logs or local paths</text>
</svg>
