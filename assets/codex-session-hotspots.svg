<svg xmlns="http://www.w3.org/2000/svg" width="450" height="360" viewBox="0 0 450 360" role="img" aria-labelledby="title desc">
  <title id="title">Codex usage hotspots preview</title>
  <desc id="desc">An anonymized preview card showing rate-limit status, hot sessions, and safety notes for public Codex usage dashboards.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1; }
      .subpanel { fill: #f8fafc; stroke: #e6e8ee; stroke-width: 1; }
      .ink { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #62656f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #202124; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .blue { fill: #3772ff; }
      .green { fill: #0f9d58; }
      .amber { fill: #d9801f; }
      .line { stroke: #e6e8ee; stroke-width: 1; }
    </style>
  </defs>

  <rect class="panel" x="1" y="1" width="448" height="358" rx="10"/>
  <text class="ink" x="24" y="42" font-size="21" font-weight="760">Limits &amp; Hotspots</text>
  <text class="muted" x="24" y="66" font-size="13">Same public snapshot, without raw sessions or local paths</text>

  <rect class="subpanel" x="24" y="94" width="402" height="92" rx="8"/>
  <text class="muted" x="44" y="122" font-size="13">Weekly remaining</text>
  <text class="green" x="44" y="158" font-size="34" font-weight="780">95%</text>
  <text class="muted" x="236" y="122" font-size="13">Reset</text>
  <text class="mono" x="236" y="153" font-size="15">May 24, 08:14</text>

  <line class="line" x1="24" y1="214" x2="426" y2="214"/>

  <circle class="blue" cx="36" cy="244" r="7"/>
  <text class="ink" x="56" y="240" font-size="15" font-weight="700">Largest interval</text>
  <text class="muted" x="56" y="263" font-size="13">Anonymized usage snapshot</text>
  <text class="ink" x="324" y="251" font-size="18" font-weight="760">43.8M</text>

  <circle class="amber" cx="36" cy="296" r="7"/>
  <text class="ink" x="56" y="292" font-size="15" font-weight="700">Output pressure</text>
  <text class="muted" x="56" y="315" font-size="13">Reasoning included in output</text>
  <text class="ink" x="328" y="303" font-size="18" font-weight="760">0.36%</text>

  <text class="muted" x="24" y="344" font-size="12">Preview data is anonymized; real pages publish aggregate numbers only.</text>
</svg>
