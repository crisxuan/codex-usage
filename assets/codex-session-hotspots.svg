<svg xmlns="http://www.w3.org/2000/svg" width="450" height="360" viewBox="0 0 450 360" role="img" aria-labelledby="title desc">
  <title id="title">Codex session hotspots preview</title>
  <desc id="desc">An anonymized example card showing hot Codex sessions ranked by total tokens, output tokens, and active time.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #ddd8cc; stroke-width: 1; }
      .ink { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #636770; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #202124; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .blue { fill: #3772ff; }
      .green { fill: #0f9d58; }
      .amber { fill: #d9801f; }
      .line { stroke: #eee9de; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="448" height="358" rx="14"/>
  <text class="ink" x="24" y="42" font-size="21" font-weight="750">Hot Sessions</text>
  <text class="muted" x="24" y="66" font-size="13">Find the sessions eating the most context</text>

  <line class="line" x1="24" y1="92" x2="426" y2="92"/>

  <circle class="blue" cx="36" cy="126" r="7"/>
  <text class="ink" x="56" y="122" font-size="15" font-weight="700">Largest total</text>
  <text class="mono" x="56" y="145" font-size="13">rollout-2026-05-10...</text>
  <text class="ink" x="292" y="132" font-size="18" font-weight="760">387.4M</text>

  <line class="line" x1="24" y1="170" x2="426" y2="170"/>

  <circle class="green" cx="36" cy="204" r="7"/>
  <text class="ink" x="56" y="200" font-size="15" font-weight="700">Largest output</text>
  <text class="mono" x="56" y="223" font-size="13">rollout-2026-05-12...</text>
  <text class="ink" x="304" y="210" font-size="18" font-weight="760">900K</text>

  <line class="line" x1="24" y1="248" x2="426" y2="248"/>

  <circle class="amber" cx="36" cy="282" r="7"/>
  <text class="ink" x="56" y="278" font-size="15" font-weight="700">Longest active window</text>
  <text class="mono" x="56" y="301" font-size="13">rollout-2026-05-09...</text>
  <text class="ink" x="294" y="288" font-size="18" font-weight="760">21h 17m</text>

  <text class="muted" x="24" y="336" font-size="12">Summary can write usage and cost charts in one command.</text>
</svg>
