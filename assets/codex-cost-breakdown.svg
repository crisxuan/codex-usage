<svg xmlns="http://www.w3.org/2000/svg" width="360" height="250" viewBox="0 0 360 250" role="img" aria-labelledby="title desc">
  <title id="title">Codex cost estimate preview</title>
  <desc id="desc">An anonymized preview card showing API-equivalent cost estimates from local Codex token aggregates.</desc>
  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1; }
      .ink { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #62656f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #202124; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .blue { fill: #3772ff; }
      .green { fill: #0f766e; }
      .amber { fill: #d9801f; }
      .line { stroke: #e7eaf1; stroke-width: 1; }
    </style>
  </defs>

  <rect class="panel" x="1" y="1" width="358" height="248" rx="10"/>
  <text class="ink" x="22" y="38" font-size="20" font-weight="760">Cost estimate</text>
  <text class="muted" x="22" y="61" font-size="12">API-equivalent, not a subscription bill</text>

  <text class="muted" x="22" y="96" font-size="12">Latest monitored window</text>
  <text class="ink" x="22" y="132" font-size="34" font-weight="780">$23.86</text>
  <text class="muted" x="22" y="154" font-size="12">28.46M tokens - 596.48 credits</text>

  <rect x="22" y="178" width="316" height="18" rx="5" fill="#eef1f6"/>
  <rect class="blue" x="22" y="178" width="190" height="18" rx="5"/>
  <rect class="green" x="212" y="178" width="74" height="18"/>
  <rect class="amber" x="286" y="178" width="52" height="18" rx="5"/>

  <line class="line" x1="22" y1="216" x2="338" y2="216"/>
  <circle class="blue" cx="30" cy="232" r="5"/>
  <text class="muted" x="42" y="236" font-size="12">cached</text>
  <circle class="green" cx="126" cy="232" r="5"/>
  <text class="muted" x="138" y="236" font-size="12">fresh</text>
  <circle class="amber" cx="210" cy="232" r="5"/>
  <text class="muted" x="222" y="236" font-size="12">output</text>
  <text class="mono" x="286" y="236" font-size="12">$13.45</text>
</svg>
