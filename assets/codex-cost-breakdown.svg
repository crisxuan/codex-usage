<svg xmlns="http://www.w3.org/2000/svg" width="450" height="360" viewBox="0 0 450 360" role="img" aria-labelledby="title desc">
  <title id="title">Codex API-equivalent cost breakdown preview</title>
  <desc id="desc">An anonymized example chart showing API-equivalent cost split by cached input, non-cached input, and output tokens.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #ddd8cc; stroke-width: 1; }
      .ink { fill: #202124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #636770; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #202124; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .green { fill: #0f9d58; }
      .amber { fill: #d9801f; }
      .red { fill: #cc3d3d; }
      .grid { stroke: #eee9de; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="448" height="358" rx="14"/>
  <text class="ink" x="24" y="42" font-size="21" font-weight="750">Cost Estimate</text>
  <text class="muted" x="24" y="66" font-size="13">API-equivalent, not your subscription bill</text>

  <text class="muted" x="24" y="110" font-size="13">Total</text>
  <text class="ink" x="24" y="148" font-size="38" font-weight="780">$500.56</text>
  <text class="muted" x="24" y="170" font-size="13">12,514 credits at 25 credits/USD</text>

  <line class="grid" x1="24" y1="204" x2="426" y2="204"/>
  <text class="muted" x="24" y="232" font-size="13">Cached input</text>
  <rect class="green" x="150" y="216" width="236" height="22" rx="5"/>
  <text class="mono" x="396" y="232" font-size="12">$340.47</text>

  <text class="muted" x="24" y="272" font-size="13">Non-cached input</text>
  <rect class="amber" x="150" y="256" width="81" height="22" rx="5"/>
  <text class="mono" x="244" y="272" font-size="12">$116.87</text>

  <text class="muted" x="24" y="312" font-size="13">Output</text>
  <rect class="red" x="150" y="296" width="30" height="22" rx="5"/>
  <text class="mono" x="194" y="312" font-size="12">$43.22</text>
</svg>
